<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-T3G2PE2VXR"></script>
<script>

  gtag('config', 'G-T3G2PE2VXR');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدواوين الشعرية | قَلَمٌ وَلَحْنُ شَاهِين</title>
<meta name="description" content="الدواوين الشعرية — قلم ولحن شاهين | SHAHEN">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0b0a08; --bg-elevated:#15120d; --bg-card:#1c1712;
    --gold:#c89b3c; --gold-bright:#e8c468; --bronze:#6b4423;
    --ivory:#ede6d6; --ivory-dim:#a89e8c; --line:#3a2e20;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg-deep); color:var(--ivory); font-family:'Tajawal',sans-serif; line-height:1.9; padding-bottom:60px;}
  .latin{font-family:'Cormorant Garamond',serif; font-style:italic;}
  
  .corner-frame{position:fixed; inset:0; pointer-events:none; z-index:110;}
  .corner-frame svg{position:absolute; width:70px; height:70px; opacity:0.5;}
  .corner-frame .tl{top:130px; left:6px;}
  .corner-frame .tr{top:130px; right:6px; transform:scaleX(-1);}
  .corner-frame .bl{bottom:10px; left:6px; transform:scaleY(-1);}
  .corner-frame .br{bottom:10px; right:6px; transform:scale(-1,-1);}
  .edge-line{position:fixed; pointer-events:none; z-index:109;
    background:repeating-linear-gradient(90deg, var(--gold) 0px, var(--gold) 2px, transparent 2px, transparent 14px);
    opacity:0.3; height:2px; left:76px; right:76px;}
  .edge-line.top{top:140px;} .edge-line.bottom{bottom:18px;}

  header{
    position:sticky; top:0; z-index:120; background:rgba(11,10,8,0.95); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line); padding:16px 20px; text-align:center;
  }
  header h1{font-family:'Aref Ruqaa',serif; color:var(--gold-bright); font-size:1.5rem;}
  header .sub{font-size:0.75rem; color:var(--gold); letter-spacing:0.08em; display:block; margin-top:4px;}
  header .back-home{display:inline-block; margin-top:8px; color:var(--ivory-dim); text-decoration:none; font-size:0.85rem; transition:color .3s;}
  header .back-home:hover{color:var(--gold-bright);}

  main{max-width:780px; margin:20px auto; padding:10px 18px;}

  .nav-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
  .btn-back{
    background:transparent; border:1px solid var(--gold); color:var(--gold-bright);
    padding:6px 16px; border-radius:4px; cursor:pointer; font-family:'Tajawal',sans-serif;
    font-size:0.9rem; transition:background .3s;
  }
  .btn-back:hover{background:rgba(200,155,60,0.15);}

  .section-title{font-family:'Aref Ruqaa',serif; color:var(--gold-bright); font-size:1.8rem; text-align:center; margin-bottom:10px;}
  .section-desc{color:var(--ivory-dim); text-align:center; font-size:0.95rem; margin-bottom:25px;}

  /* Grid for Dawaween & Poems */
  .cards-grid{display:grid; grid-template-columns:1fr; gap:16px;}
  
  .interactive-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:8px;
    padding:22px 20px; cursor:pointer; transition:border-color .3s, transform .3s, background .3s;
    display:flex; justify-content:space-between; align-items:center;
  }
  .interactive-card:hover{
    border-color:var(--gold); transform:translateY(-2px); background:rgba(200,155,60,0.05);
  }
  .interactive-card .card-info h3{font-family:'Aref Ruqaa',serif; color:var(--gold-bright); font-size:1.3rem; margin-bottom:4px;}
  .interactive-card .card-info span{color:var(--ivory-dim); font-size:0.85rem;}
  .interactive-card .arrow-icon{color:var(--gold); font-size:1.2rem;}

  /* Poem Reader View */
  .poem-reader{
    background:var(--bg-card); border:1px solid var(--gold); border-radius:8px;
    padding:35px 30px; position:relative; box-shadow:0 8px 30px rgba(0,0,0,0.6);
  }
  .poem-reader::after{
    content:"SHAHEN ©"; position:absolute; top:50%; left:50%;
    transform:translate(-50%, -50%) rotate(-20deg);
    font-family:'Cormorant Garamond',serif; font-size:clamp(3rem, 7vw, 5.5rem); font-weight:700;
    color:rgba(232, 196, 104, 0.04); letter-spacing:6px; white-space:nowrap; pointer-events:none;
  }
  .reader-header{text-align:center; margin-bottom:25px; border-bottom:1px solid var(--line); padding-bottom:15px;}
  .reader-title{font-family:'Aref Ruqaa',serif; color:var(--gold-bright); font-size:2rem; margin-bottom:6px;}
  .reader-meta{color:var(--gold); font-size:0.9rem;}
  .reader-body{
    text-align:center; color:var(--ivory); font-size:1.2rem; line-height:2.6;
    margin:25px 0; font-weight:400; position:relative; z-index:2;
  }

  footer{text-align:center; padding:40px 20px 10px; color:var(--ivory-dim); font-size:0.78rem; line-height:2;}
  footer .gold{color:var(--gold);}
</style>
</head>
<body>

<div class="corner-frame">
  <svg class="tl" viewBox="0 0 100 100" fill="none"><path d="M2 2 L2 40 M2 2 L40 2" stroke="#c89b3c" stroke-width="1.2"/><circle cx="16" cy="16" r="4" stroke="#e8c468" stroke-width="1"/></svg>
  <svg class="tr" viewBox="0 0 100 100" fill="none"><path d="M2 2 L2 40 M2 2 L40 2" stroke="#c89b3c" stroke-width="1.2"/><circle cx="16" cy="16" r="4" stroke="#e8c468" stroke-width="1"/></svg>
  <svg class="bl" viewBox="0 0 100 100" fill="none"><path d="M2 2 L2 40 M2 2 L40 2" stroke="#c89b3c" stroke-width="1.2"/><circle cx="16" cy="16" r="4" stroke="#e8c468" stroke-width="1"/></svg>
  <svg class="br" viewBox="0 0 100 100" fill="none"><path d="M2 2 L2 40 M2 2 L40 2" stroke="#c89b3c" stroke-width="1.2"/><circle cx="16" cy="16" r="4" stroke="#e8c468" stroke-width="1"/></svg>
</div>
<div class="edge-line top"></div>
<div class="edge-line bottom"></div>

<header>
  <h1>قَلَمٌ وَلَحْنُ شَاهِين</h1>
  <span class="sub latin">SHAHEN — Poetry Collections</span>
  <a href="index.html" class="back-home">← العودة للرئيسية</a>
</header>

<main id="app">
  <!-- المحتوى يتغير ديناميكياً عبر الجافاسكريبت -->
</main>

<footer>
  <span class="gold">قَلَمٌ وَلَحْنُ شَاهِين ✍️ | المُلحّن الخوارزمي</span><br>
  جميع الحقوق محفوظة / © SHAHEN | All Rights Reserved<br>
  Member APRA AMCOS (IPI Registered)
</footer>

<script>
  // قاعدة بيانات الدواوين والقصائد
  const dawaweenData = [
    {
      id: 1,
      name: "ديوان الشوق والحنين",
      latin: "Longing & Yearning",
      poems: [
        {
          title: "أعلنت حبك",
          meter: "بحر الكامل",
          text: "أَعْلَنْتُ حُبَّكِ.. لِلْوُجُودِ مَهَابَةً ... فَبِكِ الشُّمُوخُ.. يَطِيبُ لِي.. ويُخَلَّدُ<br>يا رُوحاً نَزلتْ على قَلبي لِتُحيِيَهُ ... فَصِرتِ أنتِ الهَوى.. والعِزُّ.. والمَدَدُ<br>أنا الذي قَبلكِ.. مَا ذُقتُ مَعنىً لِلصِّبا ... واليومَ في ظِلِّ عَينيكِ.. عُمري يَتَجَدَّدُ<br>تَمَرَّدي كَمَا شِئتِ.. فَالجُنونُ مَملَكتي ... وعَرشُ حُسنِكِ.. في المَدى.. لا يُصَدُّ"
        }
      ]
    },
    {
      id: 2,
      name: "ديوان الفراق والخيانة",
      latin: "Heartbreak & Betrayal",
      poems: [
        {
          title: "جرح الغياب",
          meter: "بحر البسيط",
          text: "يا مَنْ رَحَلْتَ وفي الأعمامِ تَنْهِيَدَةٌ ... هَطَلَتْ دموعُ العَينِ في سَكَنِ الدُّجى<br>خلَّفتَ في القلبِ جرحاً لا يُداويهِ ... إلا لقاءٌ طالَ واشتدَّ البُكا"
        }
      ]
    },
    {
      id: 3,
      name: "ديوان الرجولة والكرامة",
      latin: "Masculinity & Dignity",
      poems: [
        {
          title: "شامخ كالجولان",
          meter: "بحر الوافر",
          text: "أنا الجولانُ في عِرقي جَبينٌ ... أبى الإحناءَ لو هبَّتْ رياحُ<br>فلا ذلٌّ يطالُ هَامتي أبداً ... ومجدي في العلا سيفٌ يواحُ"
        }
      ]
    },
    {
      id: 4,
      name: "ديوان الوطن والهوية",
      latin: "Homeland & Identity",
      poems: [
        {
          title: "نداء الوطن",
          meter: "بحر الرمل",
          text: "وطني إن غبتُ عن عيني ترابِكَ ... فالقلبُ يحيا في هواك ويهتفُ<br>رغم الغيابِ أظلُّ أذكرُ فجرهُ ... وبحبحِ نورهِ روحي ترفرفُ"
        }
      ]
    },
    {
      id: 5,
      name: "ديوان الأهل والناكرة",
      latin: "Family & Memory",
      poems: [
        {
          title: "ذكرى الدار",
          meter: "بحر الخفيف",
          text: "يا دياراً حوت حنانَ الأحبَّة ... عشتُ فيها عهودَ ودٍّ صفيَّة<br>كم تمنيتُ لو يعودُ الزمانُ ... نلتقي والقلوبُ حيَّة نديَّة"
        }
      ]
    },
    {
      id: 6,
      name: "ديوان الحكمة وألم الإنسان",
      latin: "Wisdom & Human Pain",
      poems: [
        {
          title: "صراع الأيام",
          meter: "بحر الهزج",
          text: "سألْتُ الدهرَ عن عيشٍ ... فقالَ الدهرُ في كَدَرِ<br>فصبراً أيها الإنسانُ ... فإنَّ الفجرَ كالنجرِ"
        }
      ]
    },
    {
      id: 7,
      name: "ديوان الحب والغزل",
      latin: "Love & Romance",
      poems: [
        {
          title: "سلطانة الحسن",
          meter: "بحر الكامل",
          text: "سُلطانةٌ أنتِ.. والقانونُ في يَدِكِ ... والقَلبُ في حَضرةِ الأشواقِ.. يَسجُدُ<br>لا تَحذَري عِشقي.. فَإني بَحرٌ ثَائرٌ ... مَوجِي عَنِيدٌ.. ولَكِ الوَفاءُ.. يُعَقَّدُ"
        }
      ]
    }
  ];

  const app = document.getElementById('app');

  // عرض قائمة الدواوين (المستوى الأول)
  function renderDawaween() {
    let html = `
      <h2 class="section-title">الدواوين الشعرية السبعة</h2>
      <p class="section-desc">اختر ديواناً لتستعرض قصائده بكل سلاسة:</p>
      <div class="cards-grid">
    `;
    
    dawaweenData.forEach((diwan, index) => {
      html += `
        <div class="interactive-card" onclick="renderPoems(${index})">
          <div class="card-info">
            <h3>0${index + 1}. ${diwan.name}</h3>
            <span class="latin">${diwan.latin} — (${diwan.poems.length} قصائد)</span>
          </div>
          <div class="arrow-icon">←</div>
        </div>
      `;
    });

    html += `</div>`;
    app.innerHTML = html;
  }

  // عرض عناوين القصائد الخاصة بالديوان المختار (المستوى الثاني)
  window.renderPoems = function(diwanIndex) {
    const diwan = dawaweenData[diwanIndex];
    let html = `
      <div class="nav-bar">
        <button class="btn-back" onclick="renderDawaween()">← عودة إلى الدواوين</button>
        <span class="latin" style="color:var(--gold)">${diwan.latin}</span>
      </div>
      <h2 class="section-title">${diwan.name}</h2>
      <p class="section-desc">اضغط على عنوان القصيدة لقراءة نصها الكامل:</p>
      <div class="cards-grid">
    `;

    diwan.poems.forEach((poem, pIndex) => {
      html += `
        <div class="interactive-card" onclick="renderPoemDetail(${diwanIndex}, ${pIndex})">
          <div class="card-info">
            <h3>${poem.title}</h3>
            <span>البحر الشعري: ${poem.meter}</span>
          </div>
          <div class="arrow-icon">📖</div>
        </div>
      `;
    });

    html += `</div>`;
    app.innerHTML = html;
  };

  // عرض نص القصيدة كاملاً (المستوى الثالث)
  window.renderPoemDetail = function(diwanIndex, poemIndex) {
    const diwan = dawaweenData[diwanIndex];
    const poem = diwan.poems[poemIndex];

    let html = `
      <div class="nav-bar">
        <button class="btn-back" onclick="renderPoems(${diwanIndex})">← عودة إلى قائمة القصائد</button>
        <span class="latin" style="color:var(--gold)">${diwan.name}</span>
      </div>
      <div class="poem-reader">
        <div class="reader-header">
          <h2 class="reader-title">${poem.title}</h2>
          <div class="reader-meta">البحر الشعري: ${poem.meter} | قلم ولحن شاهين</div>
        </div>
        <div class="reader-body">
          ${poem.text}
        </div>
        <div style="text-align:center; margin-top:20px;">
          <button class="btn-back" onclick="renderPoems(${diwanIndex})">العودة للقصائد</button>
        </div>
      </div>
    `;
    app.innerHTML = html;
  };

  // التشغيل الأولي عند فتح الصفحة
  renderDawaween();
</script>

</body>
</html>
