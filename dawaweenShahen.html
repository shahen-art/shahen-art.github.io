<style>
  :root{
    --bg-deep:#0b0a08; --bg-elevated:#15120d; --bg-card:#1c1712;
    --gold:#c89b3c; --gold-bright:#e8c468; --bronze:#6b4423;
    --ivory:#ede6d6; --ivory-dim:#a89e8c; --line:#3a2e20;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg-deep); color:var(--ivory); font-family:'Tajawal',sans-serif; line-height:1.9; padding-bottom:60px;}
  .latin{font-family:'Cormorant Garamond',serif; font-style:italic;}

  .corner-frame{position:fixed; inset:0; pointer-events:none; z-index:110;}
  .corner-frame svg{position:absolute; width:70px; height:70px; opacity:0.5;}
  .corner-frame .tl{top:130px; left:6px;}
  .corner-frame .tr{top:130px; right:6px; transform:scaleX(-1);}
  .corner-frame .bl{bottom:10px; left:6px; transform:scaleY(-1);}
  .corner-frame .br{bottom:10px; right:6px; transform:scale(-1,-1);}
  .edge-line{position:fixed; pointer-events:none; z-index:109;
    background:repeating-linear-gradient(90deg, var(--gold) 0px, var(--gold) 2px, transparent 2px, transparent 14px);
    opacity:0.3; height:2px; left:76px; right:76px;}
  .edge-line.top{top:140px;} .edge-line.bottom{bottom:18px;}

  header{
    position:sticky; top:0; z-index:120; background:rgba(11,10,8,0.95); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line); padding:16px 20px; text-align:center;
  }
  header .badge{width:52px; height:52px; border-radius:50%; box-shadow:0 0 0 1px var(--gold); margin-bottom:8px;}
  header h1{font-family:'Aref Ruqaa',serif; color:var(--gold-bright); font-size:1.5rem;}
  header .sub{font-size:0.75rem; color:var(--gold); letter-spacing:0.08em;}

  #search{margin:20px auto 6px; display:block; width:calc(100% - 40px); max-width:500px;
    padding:12px 16px; background:var(--bg-card); border:1px solid var(--line); border-radius:8px;
    color:var(--ivory); font-family:'Tajawal',sans-serif; font-size:1rem;}
  #search::placeholder{color:var(--ivory-dim);}

  main{max-width:720px; margin:0 auto; padding:10px 18px;}

  .diwan-block{margin-bottom:14px; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--bg-card);}
  .diwan-head{padding:18px 20px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
  .diwan-head .name{font-family:'Aref Ruqaa',serif; font-size:1.3rem; color:var(--gold-bright);}
  .diwan-head .count{font-size:0.8rem; color:var(--ivory-dim);}
  .diwan-head .arrow{color:var(--gold); transition:transform .25s;}
  .diwan-head.open .arrow{transform:rotate(180deg);}

  .poem-grid{max-height:0; overflow:hidden; transition:max-height .4s ease;}
  .poem-grid.open{max-height:6000px;}
  .poem-card{
    margin:0 16px 16px; padding:20px; border:1px solid var(--bronze); border-radius:8px;
    background:linear-gradient(160deg, rgba(200,155,60,0.04), transparent);
    position:relative;
  }
  .poem-card .p-title{font-family:'Aref Ruqaa',serif; color:var(--gold-bright); font-size:1.15rem; margin-bottom:6px;}
  .poem-card .p-meter{font-size:0.72rem; color:var(--gold); margin-bottom:12px; display:block;}
  .poem-card .p-excerpt{color:#ffffff; font-weight:500; font-size:0.98rem; border-right:2px solid var(--gold); padding-right:12px; text-shadow:0 1px 3px rgba(0,0,0,0.6);}
  .poem-card .p-excerpt div{margin-bottom:4px;}
  .poem-card .p-sig{margin-top:14px; font-size:0.65rem; color:var(--ivory-dim); text-align:left; opacity:0.6;}

  footer{text-align:center; padding:40px 20px 10px; color:var(--ivory-dim); font-size:0.78rem; line-height:2;}
  footer .gold{color:var(--gold);}
</style>

function render(filter){
  const main = document.getElementById('main');
  main.innerHTML = '';
  for (const diwan in DATA){
    const poems = DATA[diwan];
    const filtered = filter ? poems.filter(p => p.title.includes(filter)) : poems;
    if (filtered.length === 0) continue;
    const block = document.createElement('div');
    block.className = 'diwan-block';

    const head = document.createElement('div');
    head.className = 'diwan-head' + (filter ? ' open' : '');
    head.innerHTML = `<span class="name">ديوان ${diwan}</span><span class="count">${filtered.length} قصيدة</span><span class="arrow">▾</span>`;

    const grid = document.createElement('div');
    grid.className = 'poem-grid' + (filter ? ' open' : '');

    filtered.forEach(p => {
      const card = document.createElement('div');
      card.className = 'poem-card';
      const excerptHtml = p.excerpt.map(l => `<div>${l}</div>`).join('');
      card.innerHTML = `
        <div class="p-title">${p.title}</div>
        <span class="p-meter">${p.meter}</span>
        <div class="p-excerpt">${excerptHtml}</div>
        <div class="p-sig">© Shahen</div>
      `;
      grid.appendChild(card);
    });

    head.onclick = () => { head.classList.toggle('open'); grid.classList.toggle('open'); };

    block.appendChild(head);
    block.appendChild(grid);
    main.appendChild(block);
  }
}

document.getElementById('search').addEventListener('input', e => render(e.target.value.trim()));
render('');
